name: Резервное обновление цен DZ LAB
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dz-lab-prices
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'prepodobniy77/dz-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Проверить состояние и при необходимости продолжить цикл
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PRICE_JOB_TOKEN: ${{ secrets.PRICE_JOB_TOKEN }}
        run: node scripts/run-price-update.mts
