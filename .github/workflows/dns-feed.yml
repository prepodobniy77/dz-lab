name: Импорт прайса DNS
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dz-lab-prices
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'prepodobniy77/dz-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DNS_FEED_URL: ${{ secrets.DNS_FEED_URL || vars.DNS_FEED_URL }}
    steps:
      - if: env.DNS_FEED_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: env.DNS_FEED_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - if: env.DNS_FEED_URL != ''
        run: npm exec --yes --package pnpm@11.25.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - if: env.DNS_FEED_URL != ''
        env:
          FEED_MAX_AGE_HOURS: ${{ vars.FEED_MAX_AGE_HOURS }}
          DNS_FEED_TOKEN: ${{ secrets.DNS_FEED_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PRICE_JOB_TOKEN: ${{ secrets.PRICE_JOB_TOKEN }}
        run: node scripts/import-feed.mts
