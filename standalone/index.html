<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#f5f5f7"/>
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('dz-lab-theme'); } catch {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101217' : '#f5f5f7';
    })();
  </script>
  <link rel="icon" href="/favicon.svg"/>
  <meta name="description" content="Каталог комплектующих и конфигуратор ПК DZ LAB. Сравнение цен, проверка совместимости, сохранение сборок в браузере."/>
  <title>DZ LAB — конфигуратор ПК и цены комплектующих</title>
  <style>
    :root { --font-manrope: -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; }
    body { margin:0; background:#f5f5f7; color:#1d1d1f; }
    html[data-theme="dark"] { color-scheme:dark; }
    html[data-theme="dark"] body { background:#101217; color:#f3f4f6; }
  </style>
</head>
<body>
  <div id="root"><p style="padding:32px;font-family:Arial,sans-serif">Загружаем каталог DZ LAB…</p></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
